name: partner-push

on:
  schedule:
    # UTC 01:00-14:00 = 北京时间 09:00-22:00，每半小时看一次
    - cron: '*/10 1-15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: partner-push
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 掷一次概率，抽一句他的字卡
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python tools/partner_push.py

